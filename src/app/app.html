<h1>Mi cine</h1>

@if (viendoReservas()) {
  <app-reservas (volver)="volverACartelera()" />
} @else {
  <header class="cabecera">
    <h2>Cartelera</h2>
    <button type="button" class="enlace-reserva" (click)="verReservas()">
      Ver mi reserva ({{ totalReservas() }} entradas)
    </button>
  </header>

  <!-- Buscador de Nombre -->
  <div class="buscador">
    <label for="buscar">Buscar por título</label>
    <input
      id="buscar"
      type="search"
      placeholder="Bucador por título"
      [value]="textoBuscado()"
      (input)="buscar($event)"
    />
  </div>

  @if (peliculasFiltradas().length === 0) {
    <p class="sin-resultados">
      No hay películas que coincidan con «{{ textoBuscado() }}».
    </p>
  }

  <div class="rejilla">
    @for (p of peliculasFiltradas(); track p.id) {
      <app-pelicula
          [id]="p.id"
          [titulo]="p.titulo"
          [genero]="p.genero"
          [duracion]="p.duracion"
          [precio]="p.precio"
          [disponibles]="p.disponibles"
          [cartel]="p.cartel"
      />
    }
  </div>
}
