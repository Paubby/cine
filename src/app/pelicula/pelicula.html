<article class="tarjeta">
  <img
    class="cartel"
    [ngSrc]="cartel"
    width="300"
    height="450"
    [alt]="'Cartel de ' + titulo"
  />

  <div class="contenido">
    <h3>{{ titulo }}</h3>
    <p class="info">{{ genero }} · {{ duracion }} min</p>
    <p class="precio">{{ precio }} €</p>

    @if (libres() > 0) {
      <p class="ok">Entradas disponibles: {{ libres() }}</p>
      <button type="button" (click)="anadir()">Añadir a la reserva</button>
    } @else {
      <p class="agotada">Agotada</p>
      <button type="button" disabled>No disponible</button>
    }
  </div>
</article>
